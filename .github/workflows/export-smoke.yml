# 导出冒烟：在 Linux 上导出 Windows 与安卓「验收」包并跑 导出冒烟.py（cc BW 2026-11-06，唐僧派单）；
# Windows 发行包另交给 windows-run 在 windows-latest 上真跑（Windows实机冒烟.py，cc 平台 FB 2026-11-07）；
# 安卓发行包交给 android-run 在 x86_64 模拟器上装机跑（安卓实机冒烟.py，FB 二批）。
# 只在明确要跑时触发，普通推送不跑，省分钟：手动（Actions 页 Run workflow，或 gh workflow run export-smoke.yml -r <分支>），
# 或推 ci-export/<分支>（工作流还没进默认分支时也能试跑；两个平台都跑、不留包）。
# Mac 包照旧在 Mac 本机：python3 03_再刷重制_Godot/07_开发环境/导出冒烟.py。
# 做的事：解包、文件清单、PE 头／apksigner verify／aapt2、版本号、图标、包名，再用 Linux 调试模板载入包里的 pck 跑 xiyou_mac_export、xiyou_flow。
# 签名：安卓只用每次现生成的一次性调试 keystore；不放、不读任何发行 keystore 或签名密钥。
# 模板与安卓工具版本见 07_开发环境/环境登记.json 的 cloudExport；模板 tpz 按登记的 SHA256／SHA512 校验。
# 附件：报告每次都留 3 天；包本身默认不留（仓库公开，附件登录 GitHub 的人都能下），要留就勾 upload_packages。
name: 导出冒烟

on:
  push:
    branches: ['ci-export/**']
  workflow_dispatch:
    inputs:
      platforms:
        description: 导哪几个平台
        type: choice
        options: [both, windows, android]
        default: both
      upload_packages:
        description: 把导出的包也作附件留 3 天（仓库公开，谁都能下；默认只留报告）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: 03_再刷重制_Godot/01_Godot工程
  GENERATED: 03_再刷重制_Godot/01_Godot工程/modes/xiyou/generated
  TOOLS: 03_再刷重制_Godot/07_开发环境

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((inputs.platforms == '' || inputs.platforms == 'both') && '["windows","android"]' || format('["{0}"]', inputs.platforms)) }}
    name: 导出冒烟（${{ matrix.platform }}）
    steps:
      - uses: actions/checkout@v5
      - id: reg
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('03_再刷重制_Godot/07_开发环境/环境登记.json', encoding='utf-8'))
          c = d['cloudExport']
          print('build_tools=' + c['androidBuildTools'])
          print('platform=' + c['androidPlatform'])
          print('java=' + c['java']['version'])
          print('java_dist=' + c['java']['distribution'])
          print('template_version=' + d['templateVersion'])
          EOF
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: ${{ steps.reg.outputs.java_dist }}
          java-version: ${{ steps.reg.outputs.java }}
      - if: matrix.platform == 'android'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;${{ steps.reg.outputs.build_tools }}" "platforms;${{ steps.reg.outputs.platform }}" > /dev/null
          # 导出冒烟.py 取 build-tools 下排最后的版本：只留登记的那一个
          for d in "$ANDROID_HOME"/build-tools/*; do [ "$(basename "$d")" = "${{ steps.reg.outputs.build_tools }}" ] || rm -rf "$d"; done
          ls "$ANDROID_HOME/build-tools"; java -version 2>&1 | head -1
      # Godot（与 云端选测 同一把缓存）
      - uses: actions/cache@v4
        with:
          path: ~/.cache/xiyou-godot
          key: godot-v2-${{ hashFiles('03_再刷重制_Godot/07_开发环境/环境登记.json') }}
      - id: godot
        run: python3 "$TOOLS/云端选测.py" godot
      # 导出模板（只解出要用的几个，约 200 MB 进缓存）
      - uses: actions/cache@v4
        with:
          path: ~/.cache/xiyou-templates
          key: templates-v1-${{ steps.reg.outputs.template_version }}-${{ hashFiles('03_再刷重制_Godot/07_开发环境/环境登记.json') }}
      - id: tpl
        run: python3 "$TOOLS/云端导出.py" templates
      - run: python3 "$TOOLS/云端导出.py" presets --templates "${{ steps.tpl.outputs.dir }}"
      - if: matrix.platform == 'android'
        run: python3 "$TOOLS/云端导出.py" keystore
      # 安卓走 Gradle 构建（cc 平台 android-bgidle1 2026-11-09）：装构建模板、编后台挂机插件 aar（前台服务）
      - if: matrix.platform == 'android'
        run: python3 "$TOOLS/云端导出.py" android-build --templates "${{ steps.tpl.outputs.dir }}"
      # 转换产物（不入 Git，取 refs/ci/generated/<分支>，没有就 main 的）＋导入
      - id: gen
        run: python3 "$TOOLS/云端导出.py" gen-ref --branch "${GITHUB_REF_NAME#ci-export/}"
      - run: python3 "$TOOLS/云端选测.py" fetch --ref "${{ steps.gen.outputs.ref }}"
      - env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          # O-210 的 WebP 无损最高档全量导入本机要 38 分钟，云端从零导入会超时；云端只验内容（贴图仍无损、像素相同），
          # 在 CI 检出的 project.godot 里删掉这两行、用 Godot 默认档（override.cfg 对导入不生效，实测）；缓存键在 plan 里按原文件算。cc DH 2026-11-06
          sed -i '/^textures\/webp_compression\//d' "$PROJECT/project.godot"
          rc=0; timeout 1500 "$GODOT" --headless --path "$PROJECT" --import > import.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] || grep -qE 'SCRIPT ERROR' import.log; then grep -E 'ERROR|FAIL' import.log | head -40; exit 1; fi
      - name: 导出并冒烟
        env:
          XIYOU_GODOT: ${{ steps.godot.outputs.godot }}
          XIYOU_SMOKE_RUNNER: ${{ steps.tpl.outputs.dir }}/linux_debug.x86_64
        run: |
          python3 "$TOOLS/导出冒烟.py" --platform "${{ matrix.platform }}" --out "$RUNNER_TEMP/smoke" ${{ inputs.upload_packages && '--keep' || '' }}
      # Windows 发行包交给下面的 windows-run 在真 Windows 上跑（cc 平台 FB 2026-11-07）。
      # 经 Actions 缓存传：缓存只有本仓库的工作流能读，不像附件谁都能下；windows-run 跑完就删。路径用工作区相对路径，两边才对得上。
      - name: 导出 Windows 发行包（给 windows-run；上面验收包冒烟挂了也照导，两边各报各的）
        if: ${{ !cancelled() && matrix.platform == 'windows' }}
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          mkdir -p winrel
          rc=0; timeout 900 "$GODOT" --headless --path "$PROJECT" --export-release "Windows 发行" "$PWD/winrel/再刷一把_天启篇.exe" > winrel-export.log 2>&1 || rc=$?
          ls -la winrel
          if [ "$rc" -ne 0 ] || [ ! -f winrel/再刷一把_天启篇.pck ]; then tail -40 winrel-export.log; exit 1; fi
      # 自动更新第④批：相对刚导出的 pck 做一个探针补丁，windows-run 把它放进 %APPDATA% 再跑，验真 Windows 上的补丁叠加载入。
      # 做不出来只警告、不挡别的检查（windows-run 没有 _patch 目录就跳过那一步）。
      - name: 做探针补丁（给 windows-run）
        if: ${{ !cancelled() && matrix.platform == 'windows' }}
        env:
          XIYOU_GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          python3 "$TOOLS/补丁叠加验证.py" --make-only --preset "Windows 发行" --base "$PWD/winrel/再刷一把_天启篇.pck" --patch-out "$PWD/winrel/_patch" || { echo "::warning::探针补丁没做出来，windows-run 不验补丁叠加载入"; rm -rf winrel/_patch; }
          ls -la winrel/_patch 2>/dev/null || true
      - if: ${{ !cancelled() && matrix.platform == 'windows' }}
        uses: actions/cache/save@v4
        with:
          path: winrel
          key: winrel-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      # 安卓发行包交给 android-run 在 x86_64 模拟器上装机跑（cc 平台 FB 二批 2026-11-07）。CI 副本的「安卓 发行」多开 x86_64
      # （正式预设只有 arm64-v8a；模拟器免 ARM 转译），用上面现生成的一次性调试 keystore 当发行 keystore 签名；只给冒烟，不发布。
      - name: 导出安卓发行包（给 android-run）
        if: ${{ !cancelled() && matrix.platform == 'android' }}
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          python3 - "$PROJECT/export_presets.cfg" <<'EOF'
          import re, sys
          p = sys.argv[1]; s = open(p, encoding='utf-8').read()
          parts = re.split(r'(?m)^(?=\[preset\.)', s)
          name = None
          for i, sec in enumerate(parts):
              m = re.search(r'(?m)^name="([^"]*)"', sec)
              if re.match(r'\[preset\.\d+\]\n', sec):
                  name = m.group(1) if m else None
              elif name == '安卓 发行' and sec.startswith('[preset.') and '.options]' in sec.splitlines()[0]:
                  parts[i] = sec.replace('architectures/x86_64=false', 'architectures/x86_64=true')
          open(p, 'w', encoding='utf-8').write(''.join(parts))
          EOF
          grep -n 'architectures/x86_64' "$PROJECT/export_presets.cfg"
          mkdir -p androidrel
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" GODOT_ANDROID_KEYSTORE_RELEASE_USER="$GODOT_ANDROID_KEYSTORE_DEBUG_USER" GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
          rc=0; timeout 1200 "$GODOT" --headless --path "$PROJECT" --export-release "安卓 发行" "$PWD/androidrel/再刷一把_天启篇.apk" > androidrel-export.log 2>&1 || rc=$?
          ls -la androidrel
          if [ "$rc" -ne 0 ] || [ ! -f androidrel/再刷一把_天启篇.apk ]; then tail -40 androidrel-export.log; exit 1; fi
          unzip -l androidrel/再刷一把_天启篇.apk 'lib/*' | tail -8
      # 同上，给 android-run：底包用同一份工程现导的数据包（apk 里是散文件，没有 pck；三个预设导出的数据包逐字节相同）。
      - name: 做探针补丁（给 android-run）
        if: ${{ !cancelled() && matrix.platform == 'android' }}
        env:
          XIYOU_GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          { "$XIYOU_GODOT" --headless --path "$PROJECT" --export-pack "安卓 发行" "$RUNNER_TEMP/android-base.pck" > android-base-export.log 2>&1 \
            && python3 "$TOOLS/补丁叠加验证.py" --make-only --preset "安卓 发行" --base "$RUNNER_TEMP/android-base.pck" --patch-out "$PWD/androidrel/_patch"; } \
            || { echo "::warning::探针补丁没做出来，android-run 不验补丁叠加载入"; rm -rf androidrel/_patch; }
          ls -la androidrel/_patch 2>/dev/null || true
      - if: ${{ !cancelled() && matrix.platform == 'android' }}
        uses: actions/cache/save@v4
        with:
          path: androidrel
          key: androidrel-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        run: |
          [ -f "$RUNNER_TEMP/smoke/报告.md" ] && cat "$RUNNER_TEMP/smoke/报告.md" >> "$GITHUB_STEP_SUMMARY" || echo "没有报告（导出前就失败了，看上面的日志）" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-smoke-${{ matrix.platform }}-report
          path: |
            ${{ runner.temp }}/smoke/*.md
            ${{ runner.temp }}/smoke/*.json
            ${{ runner.temp }}/smoke/*.log
          retention-days: 3
          if-no-files-found: ignore
      - if: inputs.upload_packages
        uses: actions/upload-artifact@v4
        with:
          name: export-smoke-${{ matrix.platform }}-package
          path: |
            ${{ runner.temp }}/smoke/windows
            ${{ runner.temp }}/smoke/*.apk
          retention-days: 3
          if-no-files-found: ignore

  # 真 Windows 上跑发行 exe（cc 平台 FB 2026-11-07）：入口、标题按键闪退复测、存档目录在 %APPDATA%\KYO\再刷重制。
  # 无头跑；窗口／全屏／高 DPI／输入法／手柄看不到，见 00_项目管理/Windows发行包验收清单.md。
  windows-run:
    needs: smoke
    if: ${{ !cancelled() && inputs.platforms != 'android' }}
    runs-on: windows-latest
    timeout-minutes: 30
    name: Windows 实机冒烟
    permissions:
      contents: read
      actions: write   # 跑完删掉传包用的缓存
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: 03_再刷重制_Godot/07_开发环境
      - uses: actions/cache/restore@v4
        with:
          path: winrel
          key: winrel-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: 真跑发行 exe
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: python "$TOOLS/Windows实机冒烟.py" --dir winrel --out "$RUNNER_TEMP/winrun" --try-window
      - if: always()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/winrun/报告.md" ] && cat "$RUNNER_TEMP/winrun/报告.md" >> "$GITHUB_STEP_SUMMARY" || echo "没有报告（缓存没取到：Linux 那边 Windows 发行包没导出来）" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-run-report
          path: |
            ${{ runner.temp }}/winrun/*.md
            ${{ runner.temp }}/winrun/*.json
            ${{ runner.temp }}/winrun/*.log
          retention-days: 3
          if-no-files-found: ignore
      - if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "winrel-${{ github.run_id }}-${{ github.run_attempt }}" --repo "${{ github.repository }}" || true

  # 真安卓系统上装发行包跑（cc 平台 FB 二批 2026-11-07）：x86_64 模拟器（KVM），进标题、返回键两次退出、回车开新游戏、
  # 切后台再回来同一进程、logcat 无崩溃。触屏手感、帧率、声音看不到，见 00_项目管理/安卓发行包验收清单.md。
  android-run:
    needs: smoke
    if: ${{ !cancelled() && inputs.platforms != 'windows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: 安卓实机冒烟（模拟器）
    permissions:
      contents: read
      actions: write   # 跑完删掉传包用的缓存
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: 03_再刷重制_Godot/07_开发环境
      - uses: actions/cache/restore@v4
        with:
          path: androidrel
          key: androidrel-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: 开 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模拟器里装包跑
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 "$TOOLS/安卓实机冒烟.py" --apk androidrel/再刷一把_天启篇.apk --out "$RUNNER_TEMP/androidrun"
      - if: always()
        run: |
          [ -f "$RUNNER_TEMP/androidrun/报告.md" ] && cat "$RUNNER_TEMP/androidrun/报告.md" >> "$GITHUB_STEP_SUMMARY" || echo "没有报告（缓存没取到或模拟器没起来，看上面的日志）" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-run-report
          path: |
            ${{ runner.temp }}/androidrun/*.md
            ${{ runner.temp }}/androidrun/*.json
            ${{ runner.temp }}/androidrun/*.txt
          retention-days: 3
          if-no-files-found: ignore
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "androidrel-${{ github.run_id }}-${{ github.run_attempt }}" --repo "${{ github.repository }}" || true
